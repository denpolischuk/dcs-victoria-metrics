receivers:
  prometheus:
    config:
      scrape_configs:
        - job_name: ml-api
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets:
                - ml-api.ml-api.svc.cluster.local:8000
        - job_name: backend-api
          scrape_interval: 30s
          metrics_path: /metrics
          static_configs:
            - targets:
                - backend-api.backend-api.svc.cluster.local:8000
processors:
  memory_limiter:
    check_interval: 1s
    limit_percentage: 80
    spike_limit_percentage: 25
  batch: {}
exporters:
  prometheus_remote_write:
    endpoint: http://vmsingle-vm.observability.svc.cluster.local:8428/api/v1/write
extensions:
  health_check:
    endpoint: 0.0.0.0:13133
service:
  extensions:
    - health_check
  pipelines:
    metrics:
      receivers:
        - prometheus
      processors:
        - memory_limiter
        - batch
      exporters:
        - prometheus_remote_write
