# Grafana dashboard for the ML API
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-ml-api
  namespace: observability
  labels:
    grafana_dashboard: "1"
data:
  ml-api.json: |-
    {
      "annotations": {
        "list": [
          {
            "builtIn": 1,
            "datasource": {
              "type": "grafana",
              "uid": "-- Grafana --"
            },
            "enable": true,
            "hide": true,
            "iconColor": "rgba(0, 211, 255, 1)",
            "name": "Annotations & Alerts",
            "type": "dashboard"
          }
        ]
      },
      "editable": true,
      "fiscalYearStartMonth": 0,
      "graphTooltip": 1,
      "links": [],
      "panels": [
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "Requests per second, split by endpoint.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 0
          },
          "id": 1,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum by (endpoint) (rate(ml_api_requests_total[$__rate_interval]))",
              "legendFormat": "{{endpoint}}",
              "refId": "A"
            }
          ],
          "title": "Request rate by endpoint",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "Requests per second, split by HTTP status code.",
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 0
          },
          "id": 2,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum by (status) (rate(ml_api_requests_total[$__rate_interval]))",
              "legendFormat": "{{status}}",
              "refId": "A"
            }
          ],
          "title": "Requests by status",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "Share of requests returning 5xx.",
          "fieldConfig": {
            "defaults": {
              "max": 1,
              "min": 0,
              "unit": "percentunit"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 0,
            "y": 8
          },
          "id": 3,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "(sum(rate(ml_api_requests_total{status=~\"5..\"}[$__rate_interval])) or vector(0)) / sum(rate(ml_api_requests_total[$__rate_interval]))",
              "legendFormat": "5xx ratio",
              "refId": "A"
            }
          ],
          "title": "Error ratio (5xx)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "reqps"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 8,
            "y": 8
          },
          "id": 4,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum(rate(ml_api_predictions_total[$__rate_interval]))",
              "legendFormat": "predictions/s",
              "refId": "A"
            }
          ],
          "title": "Predictions per second",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 8,
            "x": 16,
            "y": 8
          },
          "id": 5,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "ml_api_memory_bytes",
              "legendFormat": "memory",
              "refId": "A"
            }
          ],
          "title": "Application memory",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "p50 / p95 / p99 request duration.",
          "fieldConfig": {
            "defaults": {
              "unit": "s"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 16
          },
          "id": 6,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "histogram_quantile(0.50, sum by (le) (rate(ml_api_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p50",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "histogram_quantile(0.95, sum by (le) (rate(ml_api_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p95",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "histogram_quantile(0.99, sum by (le) (rate(ml_api_request_duration_seconds_bucket[$__rate_interval])))",
              "legendFormat": "p99",
              "refId": "C"
            }
          ],
          "title": "Request latency percentiles",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "CPU cores used per pod.",
          "fieldConfig": {
            "defaults": {
              "unit": "none"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 25
          },
          "id": 7,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum by (pod) (rate(container_cpu_usage_seconds_total{namespace=\"ml-api\", container=\"ml-api\"}[$__rate_interval]))",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "CPU usage",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "Memory working set per pod vs. its container memory limit/request.",
          "fieldConfig": {
            "defaults": {
              "unit": "bytes"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 25
          },
          "id": 8,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "sum by (pod) (container_memory_working_set_bytes{namespace=\"ml-api\", container=\"ml-api\"})",
              "legendFormat": "used ({{pod}})",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "kube_pod_container_resource_requests{namespace=\"ml-api\", resource=\"memory\"}",
              "legendFormat": "request",
              "refId": "B"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "kube_pod_container_resource_limits{namespace=\"ml-api\", resource=\"memory\"}",
              "legendFormat": "limit",
              "refId": "C"
            }
          ],
          "title": "Memory usage vs request/limit",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "Ready pods for the ml-api deployment (1 = healthy).",
          "fieldConfig": {
            "defaults": {
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 0,
            "y": 33
          },
          "id": 9,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "kube_deployment_status_replicas_available{namespace=\"ml-api\"}",
              "legendFormat": "available replicas",
              "refId": "A"
            },
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "kube_deployment_spec_replicas{namespace=\"ml-api\"}",
              "legendFormat": "desired replicas",
              "refId": "B"
            }
          ],
          "title": "Deployment replicas (available vs desired)",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "prometheus",
            "uid": "VictoriaMetrics"
          },
          "description": "Pod readiness: one series per pod, 1 = Ready, 0 = NotReady.",
          "fieldConfig": {
            "defaults": {
              "max": 1,
              "min": 0,
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {
                    "color": "red"
                  },
                  {
                    "color": "green",
                    "value": 1
                  }
                ]
              },
              "unit": "short"
            },
            "overrides": []
          },
          "gridPos": {
            "h": 8,
            "w": 12,
            "x": 12,
            "y": 33
          },
          "id": 10,
          "options": {
            "legend": {
              "displayMode": "list",
              "placement": "bottom",
              "showLegend": true
            },
            "tooltip": {
              "mode": "multi"
            }
          },
          "targets": [
            {
              "datasource": {
                "type": "prometheus",
                "uid": "VictoriaMetrics"
              },
              "expr": "kube_pod_status_ready{namespace=\"ml-api\", condition=\"true\"}",
              "legendFormat": "{{pod}}",
              "refId": "A"
            }
          ],
          "title": "Pod readiness",
          "type": "timeseries"
        },
        {
          "datasource": {
            "type": "victoriametrics-logs-datasource",
            "uid": "VictoriaLogs"
          },
          "gridPos": {
            "h": 9,
            "w": 24,
            "x": 0,
            "y": 57
          },
          "id": 15,
          "options": {
            "dedupStrategy": "none",
            "enableInfiniteScrolling": false,
            "enableLogDetails": true,
            "prettifyLogMessage": true,
            "showControls": false,
            "showFieldSelector": false,
            "showLevel": true,
            "showTime": true,
            "sortOrder": "Descending",
            "timestampResolution": "ms",
            "unwrappedColumns": false,
            "wrapLogMessage": false
          },
          "pluginVersion": "13.2.2",
          "targets": [
            {
              "datasource": {
                "type": "victoriametrics-logs-datasource",
                "uid": "VictoriaLogs"
              },
              "direction": "desc",
              "editorMode": "code",
              "expr": "kubernetes.pod_labels.app:\"ml-api\"",
              "legendFormat": "",
              "maxLines": 250,
              "packJson": false,
              "queryType": "instant",
              "refId": "A"
            }
          ],
          "title": "Application logs",
          "type": "logs"
        }
      ],
      "refresh": "30s",
      "schemaVersion": 42,
      "tags": [
        "ml-api",
        "apps"
      ],
      "templating": {
        "list": []
      },
      "time": {
        "from": "now-1h",
        "to": "now"
      },
      "timepicker": {},
      "timezone": "browser",
      "title": "ML API",
      "weekStart": ""
    }
