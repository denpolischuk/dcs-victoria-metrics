apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: observability
resources:
  - helmrelease-vmstack.yaml
  - otel-collector.yaml
  - otel-collector-logs.yaml
configMapGenerator:
  # Content-hashed names force a collector rollout when the config changes.
  - name: otel-collector-config
    files:
      - config.yaml=otel-collector-config.yaml
  - name: otel-collector-logs-config
    files:
      - config.yaml=otel-collector-logs-config.yaml
