# VictoriaMetrics k8s stack
apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: victoria-metrics-k8s-stack 
  namespace: observability
spec:
  interval: 1h
  releaseName: vm
  chart:
    spec:
      chart: victoria-metrics-k8s-stack # https://artifacthub.io/packages/helm/victoriametrics/victoria-metrics-k8s-stack
      version: "0.95.0"
      sourceRef:
        kind: HelmRepository
        name: victoriametrics
        namespace: observability
      interval: 1h
  install:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  upgrade:
    strategy:
      name: RetryOnFailure
      retryInterval: 5m
  values:
    fullnameOverride: vm
    
    # installed separately in ../../controllers.
    victoria-metrics-operator: 
      enabled: false
      
    # using OTel collector instead
    vmagent: 
      enabled: false 
  
    # use single node installation
    vmsingle: 
      enabled: true
      spec:
        retentionPeriod: 7d
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            memory: 1Gi

    # VictoriaLogs single node instance installation
    vlsingle:
      enabled: true
      spec:
        retentionPeriod: 7d
        storage:
          accessModes:
            - ReadWriteOnce
          resources:
            requests:
              storage: 2Gi
        resources:
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi

    vmalert:
      enabled: false
    alertmanager:
      enabled: false

    grafana:
      enabled: true
      adminPassword: admin # will do for assignment purposes; otherwise should use secrets
      grafana.ini:
        grafana-apiserver:
          preferred_api_version: dashboard.grafana.app/v1 # To be able to export V1 dashboard specs from the grafana API; compatible with the sidecar
      plugins:
        - victoriametrics-logs-datasource
      resources:
        requests:
          cpu: 100m
          memory: 1Gi
        limits:
          memory: 1Gi

    prometheus-node-exporter:
      enabled: true
    kube-state-metrics:
      enabled: true

    kubeControllerManager:
      enabled: false
    kubeScheduler:
      enabled: false
    kubeEtcd:
      enabled: false
    kubeProxy:
      enabled: false
    defaultDashboards:
      enabled: false
    defaultRules:
      create: false
    syncJob:
      enabled: false
